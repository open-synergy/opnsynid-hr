scenarios:
  - name: "SSI HR Employee Identification From Work Address - Related field accessible"
    steps:
      - step: "Create home address partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test Employee Identification Partner"

      - step: "Create employee linked to home address"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Test Employee Identification"
          address_home_id: "EVAL: registry['partner'].id"

      - step: "Assert id_numbers related field is accessible"
        action: "assert"
        target: "employee"
        asserts:
          id_numbers:
            type: "o2m"
            check: "count"
            expected_count: 0
